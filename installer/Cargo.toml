[package]
name = "camel-setup"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
description = "Native cross-platform installation wizard for Camel distributions"
license = "Apache-2.0"

[features]
capture = ["dep:image"]

[dependencies]
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
rfd = "0.15.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ring = "0.17"
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

[profile.dev]
debug = 0

[profile.test]
debug = 0
