<canvas id="space"></canvas><main><h1>Camel</h1><p>C#-shaped agent programming: validated workflows connected to local models and observable tools.</p><div class="card"><b>Live execution path</b><div class="row"><span class="node">Camel workflow</span><span class="arrow">→</span><span class="node">LM Studio</span><span class="arrow">→</span><span class="node">Typed tool registry</span></div><code>AgentResult result = await Researcher.run(topic);</code></div></main>
<script>const c=document.querySelector('canvas'),x=c.getContext('2d');function size(){c.width=innerWidth;c.height=innerHeight}onresize=size;size();let t=0;function draw(){t+=.004;x.clearRect(0,0,c.width,c.height);for(let i=0;i<80;i++){let px=(i*137+Math.sin(t+i)*30)%c.width,py=(i*71+Math.cos(t+i)*30)%c.height;x.fillStyle='rgba(95,210,255,.35)';x.fillRect(px,py,2,2)}requestAnimationFrame(draw)}draw();</script>
