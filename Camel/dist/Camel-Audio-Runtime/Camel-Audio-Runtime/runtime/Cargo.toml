[package]
name = "camel-audio-runtime"
version = "0.1.0"
edition = "2021"
description = "Focused Camel runtime host for local audio transcription and note summarization"
license = "Apache-2.0"

[dependencies]
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
