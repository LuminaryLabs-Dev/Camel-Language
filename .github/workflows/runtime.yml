name: Camel runtime
on:
  push:
    paths: ["runtime/**", "studio/**", "packages/**", "libraries/**", "Camel/examples/**", ".github/workflows/runtime.yml"]
  pull_request:
    paths: ["runtime/**", "studio/**", "packages/**", "libraries/**", "Camel/examples/**", ".github/workflows/runtime.yml"]
  workflow_dispatch:
jobs:
  conformance:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux microphone build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - run: cargo fmt --manifest-path runtime/Cargo.toml --check
      - run: cargo clippy --manifest-path runtime/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path runtime/Cargo.toml --locked
      - run: cargo run --manifest-path runtime/Cargo.toml --locked -- check Camel/examples/audio_note_summarizer.camel
      - run: cargo run --manifest-path runtime/Cargo.toml --locked -- check Camel/examples/agent_planner.camel
      - run: cargo run --manifest-path runtime/Cargo.toml --locked -- Camel/examples/programming_core.camel --json -- 6
      - run: cargo run --manifest-path runtime/Cargo.toml --locked -- check Camel/examples/orchestration.camel
  studio:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux desktop and microphone prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-dev libwayland-dev pkg-config
      - run: cargo fmt --manifest-path studio/Cargo.toml --check
      - run: cargo clippy --manifest-path studio/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path studio/Cargo.toml --locked
      - run: cargo build --release --manifest-path studio/Cargo.toml --locked
